# ActorTemplate for the counter demo on firecracker workers. Modeled on
# substrate's own demos/counter/counter-microvm-template.yaml.tmpl.
#
# Not a CRD -- applied through ateapi's control API via kubectl-ate, after
# `ko resolve` replaces the ko:// image reference. See
# scripts/create-actor-template.sh for the exact pipeline (sed substitution,
# ko resolve, kubectl ate create), run from inside fcvm.
#
# Needs: the ate-demo-counter-firecracker atespace/namespace and the
# counter-firecracker WorkerPool (k8s-resources/workerpool.yaml) already
# applied, same KO_DOCKER_REPO/BUCKET_NAME env as the install scripts use
# (localhost:5001 / ate-snapshots on this kind cluster).
#
# golden_snapshot_config is explicitly DISABLED: it defaults to ENABLED when
# omitted, which would make the control plane try to build a golden snapshot
# right away -- i.e. call checkpoint_workload on ateom-fc, which is still a
# todo!() stub. Disabling it keeps this to exactly one RunWorkload call.
#
# No wakeupProbe: it's optional, and pointless here anyway -- RunWorkload
# itself is still a todo!() stub on the ateom-fc side (logs the request, then
# panics), so nothing will ever come up far enough to answer an HTTP probe.
metadata:
  atespace: ate-demo-counter-firecracker
  name: counter-firecracker
workerSelector:
  matchLabels:
    workload: counter-firecracker
containers:
- name: counter
  image: ko://github.com/agent-substrate/substrate/demos/counter
  command:
  - /ko-app/counter
resources:
  limits:
  - name: cpu
    quantity: "1"
  - name: memory
    quantity: 512Mi
snapshotConfig:
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
  storageLocation: gs://${BUCKET_NAME}/ate-demo-counter-firecracker/
  goldenSnapshotConfig:
    mode: GOLDEN_SNAPSHOT_MODE_DISABLED
sandboxConfig:
  sandboxClass: SANDBOX_CLASS_FIRECRACKER
  configName: firecracker
