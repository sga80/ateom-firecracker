<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-label="Diagram showing ateom-fc on the host preparing images, booting the microVM, talking to the guest over vsock, and setting up tap networking. All of this passes through a firecracker VMM process in the middle, which is what actually implements the vsock device and the virtio-net device the guest sees. Only the seam between firecracker and the guest kernel it runs is the hardware-trapped boundary. vsock has two distinct hops: a one-time PUT at boot that creates the vsock device, and a separate runtime connect plus ttrpc calls that flow through it afterward. Networking works the same way: ateom-fc hands firecracker a tap device name over PUT /network-interfaces, which firecracker opens and presents to the guest as eth0; guest-init then configures eth0's address and default route itself via raw ioctls.">
  <style>
    :root {
      --surface:#ffffff;
      --surface-muted:#e3e9ea;
      --ink:#10181a;
      --muted:#51636a;
      --border:#c7d0d2;
      --accent:#0f7a73;
      --accent-2:#c1440e;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface:#121b1e;
        --surface-muted:#19262a;
        --ink:#e8eef0;
        --muted:#93a7ad;
        --border:#2a3a3f;
        --accent:#39c7ba;
        --accent-2:#e2793a;
        color-scheme: dark;
      }
    }
    text { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
    .box-title { font-weight: 600; }
    .box-sub { font-family: -apple-system, BlinkMacSystemFont, sans-serif; fill: var(--muted); }
    .eyebrow-svg { letter-spacing: .07em; text-transform: uppercase; fill: var(--muted); }
    .arrow-label { font-family: -apple-system, BlinkMacSystemFont, sans-serif; fill: var(--muted); }
    .boundary-label { letter-spacing: .06em; text-transform: uppercase; fill: var(--ink); opacity: .75; }
  </style>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="540" y="28" class="boundary-label" font-size="10" text-anchor="middle">guest boundary — hardware-trapped (VT-x / EL2 + EPT)</text>
  <line x1="540" y1="40" x2="540" y2="532" stroke="var(--ink)" stroke-width="2" stroke-dasharray="7 6" opacity=".55"/>

  <text x="40" y="20" class="eyebrow-svg" font-size="11">Host — ateom-fc, inside the Lima VM</text>
  <text x="560" y="20" class="eyebrow-svg" font-size="11">Guest — inside the microVM</text>

  <rect x="340" y="40" width="200" height="492" rx="10" fill="var(--surface-muted)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="360" y="66" class="box-title" font-size="13.5" fill="var(--ink)">firecracker</text>
  <text x="360" y="82" class="box-sub" font-size="10.5">VMM process · child of ateom-fc</text>
  <text x="360" y="96" class="box-sub" font-size="10.5">opens /dev/kvm</text>

  <rect x="40" y="46" width="280" height="82" rx="8" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
  <text x="60" y="72" class="box-title" font-size="14" fill="var(--accent)">Image prep — M3</text>
  <text x="60" y="88" class="box-sub" font-size="10.5">docker_ext4.rs</text>
  <text x="60" y="104" class="box-sub" font-size="10.5">lower.ext4 — read-only image</text>
  <text x="60" y="120" class="box-sub" font-size="10.5">upper.ext4 — empty, per actor</text>

  <rect x="40" y="142" width="280" height="128" rx="8" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
  <text x="60" y="168" class="box-title" font-size="14" fill="var(--accent)">Boot the microVM — M1 → M3</text>
  <text x="60" y="184" class="box-sub" font-size="10.5">fcstarter + booter</text>
  <text x="60" y="200" class="box-sub" font-size="10.5">drives: root · image (ro) · upper (rw)</text>
  <text x="60" y="216" class="box-sub" font-size="10.5">boot-source → drives →</text>
  <text x="60" y="232" class="box-sub" font-size="10.5">vsock config → machine-config → start</text>

  <rect x="40" y="284" width="280" height="96" rx="8" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
  <text x="60" y="310" class="box-title" font-size="14" fill="var(--accent)">Talk to the guest — M1</text>
  <text x="60" y="326" class="box-sub" font-size="10.5">virtual_sock.rs · runtime, after boot</text>
  <text x="60" y="342" class="box-sub" font-size="10.5">connect UDS → CONNECT 8080</text>
  <text x="60" y="358" class="box-sub" font-size="10.5">ttrpc: ping → exec (fire-and-forget)</text>

  <rect x="40" y="394" width="280" height="126" rx="8" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
  <text x="60" y="420" class="box-title" font-size="14" fill="var(--accent)">Networking — M4</text>
  <text x="60" y="436" class="box-sub" font-size="10.5">tap.rs + fcstarter.rs</text>
  <text x="60" y="452" class="box-sub" font-size="10.5">netns (rtnetlink) → setns →</text>
  <text x="60" y="468" class="box-sub" font-size="10.5">/dev/net/tun → TUNSETIFF → PERSIST</text>
  <text x="60" y="484" class="box-sub" font-size="10.5">host addr/link-up → PUT /network-interfaces</text>
  <text x="60" y="500" class="box-sub" font-size="10.5">firecracker joins the actor's netns via setns</text>

  <rect x="560" y="46" width="280" height="140" rx="8" fill="var(--surface)" stroke="var(--accent-2)" stroke-width="2"/>
  <text x="580" y="72" class="box-title" font-size="14" fill="var(--accent-2)">guest-init — PID 1</text>
  <text x="580" y="88" class="box-sub" font-size="10.5">mounts, in order</text>
  <text x="580" y="104" class="box-sub" font-size="10.5">/proc · /sys</text>
  <text x="580" y="120" class="box-sub" font-size="10.5">/dev/vdb → /mnt/image (ro)</text>
  <text x="580" y="136" class="box-sub" font-size="10.5">/dev/vdc → /mnt/upper-device (rw)</text>
  <text x="580" y="152" class="box-sub" font-size="10.5">overlay → /mnt/upper-device/merged</text>

  <line x1="700" y1="186" x2="700" y2="198" stroke="var(--accent-2)" stroke-width="1.75" marker-end="url(#arrow2)" style="color:var(--accent-2)"/>
  <text x="713" y="196" class="arrow-label" font-size="10">exec (fire-and-forget)</text>

  <rect x="560" y="200" width="280" height="78" rx="7" fill="var(--surface)" stroke="var(--accent-2)" stroke-width="2"/>
  <text x="580" y="226" class="box-title" font-size="14" fill="var(--accent-2)">actor process</text>
  <text x="580" y="242" class="box-sub" font-size="10.5">exec'd from the merged dir</text>
  <text x="580" y="258" class="box-sub" font-size="10.5">e.g. /counter — no wait()</text>

  <rect x="560" y="292" width="280" height="88" rx="8" fill="var(--surface)" stroke="var(--accent-2)" stroke-width="2"/>
  <text x="580" y="318" class="box-title" font-size="14" fill="var(--accent-2)">eth0 via tap0 — M4</text>
  <text x="580" y="334" class="box-sub" font-size="10.5">network.rs, raw BSD ioctls</text>
  <text x="580" y="350" class="box-sub" font-size="10.5">static 169.254.17.2/30 + default route</text>
  <text x="580" y="366" class="box-sub" font-size="10.5">via gateway 169.254.17.1 (host side of tap0)</text>

  <circle cx="360" cy="232" r="4" fill="var(--accent)"/>
  <text x="372" y="228" class="arrow-label" font-size="9.5" fill="var(--accent)">vsock device</text>
  <text x="372" y="240" class="arrow-label" font-size="9" fill="var(--muted)" font-style="italic">created at boot</text>

  <line x1="320" y1="232" x2="352" y2="232" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow2)" style="color:var(--accent)"/>
  <text x="315" y="222" text-anchor="end" class="arrow-label" font-size="9.5" fill="var(--accent)">PUT /vsock {uds_path}</text>

  <circle cx="360" cy="342" r="4" fill="var(--accent)"/>
  <text x="372" y="338" class="arrow-label" font-size="9.5" fill="var(--accent)">relays, at runtime</text>

  <path d="M 320 342 L 400 342 L 400 116 L 560 116" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#arrow2)" style="color:var(--accent)"/>
  <text x="410" y="100" class="arrow-label" font-size="9.5" fill="var(--accent)">AF_VSOCK:8080 → guest-init ttrpc</text>

  <circle cx="360" cy="484" r="4" fill="var(--accent)"/>
  <text x="372" y="480" class="arrow-label" font-size="9.5" fill="var(--accent)">tap → virtio-net</text>

  <path d="M 320 484 L 400 484 L 400 330 L 560 330" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#arrow2)" style="color:var(--accent)"/>
  <text x="410" y="316" class="arrow-label" font-size="9.5" fill="var(--accent)">PUT /network-interfaces → opens tap0 → presented as eth0</text>
</svg>
