syntax = "proto3";

package ateompb;

message PingRequest{
  string message = 1;
}
message PingResponse{
  string message = 1;
}
message ExecRequest{
  string command = 1 ;
}
message ExecResponse{
  bool success = 1;
}

service GuestAgent {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Exec(ExecRequest) returns (ExecResponse);
}