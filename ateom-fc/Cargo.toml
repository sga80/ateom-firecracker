[package]
name = "ateom-fc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-vsock = "0.7.2"
uuid = { version = "1.28.0", features = ["v4"] }
vsock = "0.5.4"
ttrpc = { version = "0.10.0", features = ["async", "async-trait", "async-stream"] }
ateomfcpb = { path = "../ateomfcpb" }
